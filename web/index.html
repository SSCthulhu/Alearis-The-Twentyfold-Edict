<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alearis: The Twentyfold Edict</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas,
      #hud-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud-canvas {
        pointer-events: none;
        z-index: 2;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      #ui-root > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <canvas id="hud-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
